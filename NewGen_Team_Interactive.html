<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewGen 团队分工规划 · 可编辑版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --page-bg:#F5F6FA; --border:#E0E4EE; --text:#1A1E2E; --muted:#6B7280;
  --urgent-bg:#FDECEA; --urgent:#C0392B;
  --week-bg:#FEF4E4;   --week:#7D4D00;
  --ongoing-bg:#ECF7EC; --ongoing:#245E2A;
  --asneeded-bg:#F0EBF8; --asneeded:#5B2D90;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{font-family:'DM Sans',sans-serif;background:var(--page-bg);color:var(--text);-webkit-print-color-adjust:exact;print-color-adjust:exact;}

/* Cover */
.cover{background:#1B2B4B;color:#fff;padding:48px 64px 40px;position:relative;overflow:hidden;}
.cover::after{content:'';position:absolute;right:-40px;top:-40px;width:300px;height:300px;border:1px solid rgba(255,255,255,0.07);border-radius:50%;pointer-events:none;}
.cover-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:14px;}
.cover h1{font-family:'Playfair Display',serif;font-size:36px;font-weight:600;line-height:1.2;margin-bottom:10px;}
.cover-sub{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:28px;}
.cover-pills{display:flex;gap:8px;flex-wrap:wrap;}
.cover-pill{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,.75);}
.cover-meta{font-size:11px;color:rgba(255,255,255,.35);margin-top:16px;letter-spacing:.03em;}
.cover-actions{position:absolute;top:20px;right:24px;display:flex;gap:8px;}
.cover-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85);border-radius:5px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s;}
.cover-btn:hover{background:rgba(255,255,255,.2);}

/* Leads row */
.leads-row{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid var(--border);}
.lead-card{padding:18px 20px;border-right:1px solid var(--border);position:relative;}
.lead-card:last-child{border-right:none;}
.lead-accent{position:absolute;top:0;left:0;width:3px;height:100%;}
.lead-role{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.lead-name{font-family:'Playfair Display',serif;font-size:16px;margin-bottom:2px;}
.lead-dept{font-size:11px;color:var(--muted);}
.lead-badge{display:inline-block;margin-top:7px;font-size:10px;padding:2px 8px;border-radius:3px;font-weight:500;}

/* Sections */
.sections{padding:0 24px;}
.section{margin-top:24px;}
.section:last-child{margin-bottom:24px;}
.dept-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;}
.dept-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:#fff;font-family:'Playfair Display',serif;flex-shrink:0;}
.dept-header-text h2{font-family:'Playfair Display',serif;font-size:17px;font-weight:500;}
.dept-header-text p{font-size:11px;opacity:.65;margin-top:1px;}
.dept-body{background:#fff;border:1px solid var(--border);border-radius:0 0 8px 8px;overflow:hidden;}

/* Key tasks */
.key-tasks{padding:18px 20px;border-bottom:1px solid var(--border);}
.section-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;}
.key-tasks-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;}
.key-task-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:var(--page-bg);position:relative;}
.key-task-item:hover .item-del{opacity:1!important;}
.key-task-num{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#fff;flex-shrink:0;margin-top:1px;}
.keytask-text{font-size:12px;line-height:1.5;flex:1;cursor:text;outline:none;}
.keytask-text:focus{background:rgba(0,0,0,.04);border-radius:3px;padding:1px 3px;margin:-1px -3px;outline:1px solid rgba(0,0,0,.12);}
.item-del{opacity:0!important;background:none;border:none;cursor:pointer;color:#bbb;font-size:17px;line-height:1;padding:0 2px;flex-shrink:0;transition:color .15s;}
.item-del:hover{color:var(--urgent)!important;}
.add-task-row{margin-top:8px;}
.add-btn{background:none;border:1px dashed var(--border);border-radius:5px;color:var(--muted);cursor:pointer;font-size:12px;padding:5px 12px;font-family:inherit;transition:all .15s;width:100%;}
.add-btn:hover{border-color:#aaa;color:var(--text);background:rgba(0,0,0,.02);}

/* Team grid */
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.member-card{padding:18px 20px;border-right:1px solid var(--border);border-top:1px solid var(--border);}
.member-card:last-child{border-right:none;}
.member-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;}
.member-name{font-weight:500;font-size:13px;}
.member-role{font-size:11px;color:var(--muted);}
.lead-tag{margin-left:auto;font-size:9px;padding:2px 7px;border-radius:3px;font-weight:500;white-space:nowrap;}

/* Todo items */
.todo-list{display:flex;flex-direction:column;min-height:20px;}
.todo-item{display:flex;align-items:flex-start;gap:7px;padding:6px 4px;border-radius:5px;position:relative;transition:background .1s;}
.todo-item:hover{background:rgba(0,0,0,.025);}
.todo-item:hover .drag-handle,.todo-item:hover .todo-del{opacity:1;}
.drag-handle{opacity:0;cursor:grab;color:#c0c5d0;font-size:15px;margin-top:2px;flex-shrink:0;transition:opacity .15s;user-select:none;padding:0 1px;}
.drag-handle:active{cursor:grabbing;}
.todo-check{width:14px;height:14px;border:1.5px solid #ccc;border-radius:3px;flex-shrink:0;margin-top:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.todo-check.ck{background:#52b060;border-color:#52b060;}
.todo-check.ck::after{content:'✓';color:#fff;font-size:9px;}
.pbadge{flex-shrink:0;font-size:9px;padding:2px 6px;border-radius:3px;font-weight:500;white-space:nowrap;cursor:pointer;margin-top:2px;transition:transform .1s;user-select:none;}
.pbadge:hover{transform:scale(1.06);}
.pbadge:active{transform:scale(.95);}
.todo-text{flex:1;font-size:12px;line-height:1.5;cursor:text;word-break:break-word;outline:none;}
.todo-text:focus{background:rgba(0,0,0,.04);border-radius:3px;padding:1px 3px;margin:-1px -3px;outline:1px solid rgba(0,0,0,.12);}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted);}
.todo-del{opacity:0;background:none;border:none;cursor:pointer;color:#bbb;font-size:17px;line-height:1;padding:0 2px;flex-shrink:0;margin-top:1px;transition:opacity .15s,color .15s;}
.todo-del:hover{color:var(--urgent);}
.sortable-ghost{opacity:.3;background:#e4e8f5!important;border-radius:5px;}
.sortable-drag{opacity:.95!important;box-shadow:0 4px 16px rgba(0,0,0,.15)!important;border-radius:5px;}

/* Legend */
.legend{display:flex;align-items:center;gap:16px;padding:14px 24px;background:#fff;border-top:1px solid var(--border);flex-wrap:wrap;margin-top:24px;}
.legend-title{font-size:11px;color:var(--muted);font-weight:500;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;}
.legend-hint{margin-left:auto;font-size:11px;color:var(--muted);font-style:italic;}

/* Edit mode */
body:not(.edit-mode) .todo-del,
body:not(.edit-mode) .item-del,
body:not(.edit-mode) .drag-handle,
body:not(.edit-mode) .add-task-row{display:none;}
body:not(.edit-mode) .todo-text,
body:not(.edit-mode) .keytask-text{pointer-events:none;user-select:none;cursor:default;}
body.edit-mode .cover-btn#editBtn{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.5);}

/* Save toast */
#save-toast{position:fixed;bottom:24px;right:24px;background:#1B2B4B;color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000;}
#save-toast.show{opacity:1;}
</style>

function fmtDate(iso){if(!iso)return '—';const d=new Date(iso);const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function findMember(id){for(const d of data.departments){const m=d.members.find(m=>m.id===id);if(m)return m;}}
function findDept(id){return data.departments.find(d=>d.id===id);}

let data = loadData();
let _sortables = {};

// ── Render helpers ──────────────────────────
function pbadge(p){const v=PRI[p]||PRI.ongoing;return `<span class="pbadge" style="background:${v.bg};color:${v.c};" data-act="cyc">${v.l}</span>`;}

function rTodo(t,mid){
  return `<div class="todo-item${t.done?' done':''}" data-tid="${t.id}" data-mid="${mid}">
  <span class="drag-handle" title="拖拽换人">⠿</span>
  <div class="todo-check${t.done?' ck':''}" data-act="chk"></div>
  ${pbadge(t.priority)}
  <div class="todo-text" data-act="etxt" spellcheck="false">${esc(t.text)}</div>
  <button class="todo-del" data-act="del" title="删除">×</button>
</div>`;}

function rMember(m,meta){
  const leadTag=m.isLead?`<span class="lead-tag" style="background:${meta.color};color:#fff;">负责人</span>`:'';
  return `<div class="member-card">
  <div class="member-head">
    <div class="avatar" style="background:${meta.light};color:${meta.color};">${m.initials}</div>
    <div><div class="member-name">${esc(m.name)}</div><div class="member-role">${esc(m.role)}</div></div>
    ${leadTag}
  </div>
  <div class="section-label">TODO List</div>
  <div class="todo-list" data-mid="${m.id}">
    ${m.todos.map(t=>rTodo(t,m.id)).join('')}
  </div>
  <div class="add-task-row">
    <button class="add-btn" data-act="addtodo" data-mid="${m.id}">+ 添加任务</button>
  </div>
</div>`;}

function rKeyTask(t,deptId,i,meta){
  return `<div class="key-task-item" data-ki="${i}" data-did="${deptId}">
  <div class="key-task-num" style="background:${meta.color};">${i+1}</div>
  <div class="keytask-text" data-act="ekt" spellcheck="false">${esc(t)}</div>
  <button class="item-del" data-act="delkt" title="删除">×</button>
</div>`;}

function rDept(d){
  const meta=META[d.id];
  const leadName=d.members.find(m=>m.isLead)?.name||'';
  return `<div class="section" data-did="${d.id}">
  <div class="dept-header" style="background:${meta.light};border-color:${meta.border};color:${meta.color};">
    <div class="dept-icon" style="background:${meta.color};">${meta.icon}</div>
    <div class="dept-header-text"><h2>${esc(d.label)} · ${esc(leadName)} 负责</h2><p>${esc(d.subtitle)}</p></div>
  </div>
  <div class="dept-body">
    <div class="key-tasks">
      <div class="section-label">部门重点任务</div>
      <div class="key-tasks-list" data-did="${d.id}">
        ${d.keyTasks.map((t,i)=>rKeyTask(t,d.id,i,meta)).join('')}
      </div>
      <div class="add-task-row"><button class="add-btn" data-act="addkt" data-did="${d.id}">+ 添加重点任务</button></div>
    </div>
    <div class="team-grid">${d.members.map(m=>rMember(m,meta)).join('')}</div>
  </div>
</div>`;}

function rLeads(){
  const rows=[
    {id:'overall',    role:'总负责人',         name:'Joyce Liang', loc:'CEO · Bay Area'},
    {id:'tech',       role:'Tech 负责人',       name:'Jeff Lin',    loc:'Tech Lead · Seattle'},
    {id:'marketing',  role:'Marketing 负责人',  name:'Iris Sui',    loc:'Marketing Lead · China'},
    {id:'backoffice', role:'BackOffice 负责人', name:'Chelsea Zhu', loc:'BackOffice Lead · Bay Area'},

  <div class="lead-role">${r.role}</div>
  <div class="lead-name">${r.name}</div>
  <div class="lead-dept">${r.loc}</div>
  <span class="lead-badge" style="background:${m.light};color:${m.color};">${d?.pillar||''}</span>
</div>`;}).join('')}</div>`;}

function rPage(){
  document.getElementById('app').innerHTML=
    `<div class="cover">
  <div class="cover-actions">
    <button class="cover-btn" id="editBtn" data-act="editToggle">✏ 编辑</button>
    <button class="cover-btn" data-act="exportHtml">↓ 导出</button>
    <button class="cover-btn" id="publishBtn" data-act="publishGH">☁ 发布</button>

  </div>
  <div class="cover-label">NewGen Growth Ecosystem · 内部工作文件</div>
  <h1>团队分工规划</h1>

  <div class="cover-pills">
    <div class="cover-pill"><span style="opacity:.5;margin-right:4px;">P1</span>Tech Growth Engine</div>
    <div class="cover-pill"><span style="opacity:.5;margin-right:4px;">P2</span>Consumer Acquisition</div>
    <div class="cover-pill"><span style="opacity:.5;margin-right:4px;">P3</span>Agent Growth Platform</div>
    <div class="cover-pill"><span style="opacity:.5;margin-right:4px;">P4</span>Professional Referral</div>

  <div class="cover-meta">v${data.version||'1.0.0'} · 最后更新 ${fmtDate(data.lastUpdated)}</div>

  <div class="legend-item"><span class="pbadge" style="background:#FEF4E4;color:#7D4D00;">本周</span>本周推进</div>
  <div class="legend-item"><span class="pbadge" style="background:#ECF7EC;color:#245E2A;">持续</span>常态任务</div>
  <div class="legend-item"><span class="pbadge" style="background:#F0EBF8;color:#5B2D90;">视需要</span>按情况执行</div>
  <span class="legend-hint">按 E 进入编辑模式 · 点击标签切换优先级 · 拖拽换人 · Cmd/Ctrl+S 保存 · ↓ 导出版本快照</span>

// ── Sortable ────────────────────────────────
function makeSortableOnList(el){
  const mid=el.dataset.mid;
  if(_sortables[mid]){try{_sortables[mid].destroy();}catch(e){}}
  _sortables[mid]=Sortable.create(el,{
    group:'tasks', handle:'.drag-handle', animation:150,
    ghostClass:'sortable-ghost', dragClass:'sortable-drag',
    onEnd(evt){
      const tid=evt.item.dataset.tid;
      const fid=evt.from.dataset.mid;
      const tid2=evt.to.dataset.mid;
      const ni=evt.newIndex;
      const fm=findMember(fid), tm=findMember(tid2);
      if(!fm||!tm)return;
      const idx=fm.todos.findIndex(t=>t.id===tid);
      if(idx===-1)return;
      const [task]=fm.todos.splice(idx,1);
      evt.item.dataset.mid=tid2;
      tm.todos.splice(ni,0,task);
      save();
    }
  });
}
function initSortables(){
  _sortables={};
  document.querySelectorAll('.todo-list').forEach(makeSortableOnList);
}

// ── Events ──────────────────────────────────
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const act=el.dataset.act;

  // Edit mode toggle
  if(act==='editToggle'){setEditMode(!isEditMode);return;}

  // Export HTML
  if(act==='exportHtml'){exportHtml();return;}

  // Publish to GitHub (Shift+click to reset stored token)
  if(act==='publishGH'){
    if(e.shiftKey){localStorage.removeItem('ng-gh-token');alert('GitHub token cleared.');return;}
    publishToGitHub();return;
  }

  // Reset
  if(act==='reset'){
    if(confirm('确定重置所有数据？这将清除所有改动。')){
      data=JSON.parse(JSON.stringify(DEF));save();rPage();
    }
    return;
  }

  // Toggle done
  if(act==='chk'){
    const item=el.closest('.todo-item');
    const tid=item.dataset.tid, mid=item.dataset.mid;
    const m=findMember(mid); const t=m?.todos.find(x=>x.id===tid);
    if(!t)return;
    t.done=!t.done;
    item.classList.toggle('done',t.done);
    el.classList.toggle('ck',t.done);
    save(); return;
  }

  // Cycle priority
  if(act==='cyc'){
    const item=el.closest('.todo-item');
    const tid=item.dataset.tid, mid=item.dataset.mid;
    const m=findMember(mid); const t=m?.todos.find(x=>x.id===tid);
    if(!t)return;
    t.priority=PO[(PO.indexOf(t.priority)+1)%PO.length];
    const v=PRI[t.priority];
    el.textContent=v.l; el.style.background=v.bg; el.style.color=v.c;
    save(); return;
  }

  // Delete todo
  if(act==='del'){
    const item=el.closest('.todo-item');
    const tid=item.dataset.tid, mid=item.dataset.mid;
    const m=findMember(mid);
    if(!m)return;
    m.todos=m.todos.filter(t=>t.id!==tid);
    item.remove(); save(); return;
  }

  // Add todo
  if(act==='addtodo'){
    const mid=el.dataset.mid;
    const m=findMember(mid); if(!m)return;
    const nt={id:uid(),text:'新任务',priority:'week',done:false};
    m.todos.push(nt); save();
    const list=document.querySelector(`.todo-list[data-mid="${mid}"]`);
    const tmp=document.createElement('div');
    tmp.innerHTML=rTodo(nt,mid);
    const nel=tmp.firstElementChild;
    list.appendChild(nel);
    makeSortableOnList(list);
    const txt=nel.querySelector('.todo-text');
    if(isEditMode) txt.setAttribute('contenteditable','true');
    txt.focus(); document.execCommand('selectAll',false,null);
    return;
  }

  // Delete key task
  if(act==='delkt'){
    const item=el.closest('.key-task-item');
    const did=item.dataset.did, ki=parseInt(item.dataset.ki,10);
    const d=findDept(did); if(!d)return;
    d.keyTasks.splice(ki,1); save();
    const meta=META[did];
    const list=document.querySelector(`.key-tasks-list[data-did="${did}"]`);
    list.innerHTML=d.keyTasks.map((t,i)=>rKeyTask(t,did,i,meta)).join('');
    return;
  }

  // Add key task
  if(act==='addkt'){
    const did=el.dataset.did;
    const d=findDept(did); if(!d)return;
    d.keyTasks.push('新重点任务'); save();
    const meta=META[did];
    const i=d.keyTasks.length-1;
    const list=document.querySelector(`.key-tasks-list[data-did="${did}"]`);
    const tmp=document.createElement('div');
    tmp.innerHTML=rKeyTask('新重点任务',did,i,meta);
    const nel=tmp.firstElementChild;
    list.appendChild(nel);
    const txt=nel.querySelector('.keytask-text');
    if(isEditMode) txt.setAttribute('contenteditable','true');
    txt.focus(); document.execCommand('selectAll',false,null);
    return;
  }
},true);

// Save contenteditable on blur
document.addEventListener('blur',function(e){
  if(e.target.dataset.act==='etxt'){
    const item=e.target.closest('.todo-item');
    const tid=item?.dataset.tid, mid=item?.dataset.mid;
    const m=findMember(mid); const t=m?.todos.find(x=>x.id===tid);
    if(t){t.text=e.target.textContent.trim()||t.text; save();}
  }
  if(e.target.dataset.act==='ekt'){
    const item=e.target.closest('.key-task-item');
    const did=item?.dataset.did, ki=parseInt(item?.dataset.ki,10);
    const d=findDept(did);
    if(d&&!isNaN(ki)){d.keyTasks[ki]=e.target.textContent.trim()||d.keyTasks[ki]; save();}
  }
},true);

// Keyboard shortcuts
document.addEventListener('keydown',function(e){
  // Cmd/Ctrl+S — save to localStorage
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save();showToast();return;}
  // E — toggle edit mode (only when not typing in a contenteditable)
  if((e.key==='e'||e.key==='E')&&!e.target.getAttribute('contenteditable')&&!e.metaKey&&!e.ctrlKey){
    setEditMode(!isEditMode);return;
  }
  // Enter confirms inline edit
  if(e.key==='Enter'&&(e.target.dataset.act==='etxt'||e.target.dataset.act==='ekt')){
    e.preventDefault();e.target.blur();
  }
},true);

// ── Edit mode & Export ──────────────────────
let isEditMode = false;

function applyEditMode(){
  document.body.classList.toggle('edit-mode',isEditMode);
  document.querySelectorAll('.todo-text,.keytask-text').forEach(el=>{
    if(isEditMode) el.setAttribute('contenteditable','true');
    else el.removeAttribute('contenteditable');
  });
  const btn=document.getElementById('editBtn');
  if(btn) btn.textContent=isEditMode?'💾 完成':'✏ 编辑';
}

function setEditMode(on){
  isEditMode=on;
  applyEditMode();
  if(!on){save();showToast();}
}

function showToast(msg){
  const t=document.getElementById('save-toast');
  if(!t)return;
  t.textContent=msg||'已保存 ✓';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.classList.remove('show');t.textContent='已保存 ✓';},1800);
}

function bumpVersion(v){
  const parts=(v||'1.0.0').split('.').map(Number);
  parts[2]=(parts[2]||0)+1;
  return parts.join('.');
}

function downloadBlob(blob,filename){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function buildExportHtml(){
  const appEl=document.getElementById('app');
  const savedContent=appEl.innerHTML;
  appEl.innerHTML='';
  let html=document.documentElement.outerHTML;
  appEl.innerHTML=savedContent;
  return html.replace(/\/\*DEF_START\*\/[\s\S]*?\/\*DEF_END\*\//,
    `/*DEF_START*/\nconst DEF = ${JSON.stringify(data)};\n/*DEF_END*/`);
}

function exportHtml(){
  data.version=bumpVersion(data.version);
  save();
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const filename=`NewGen_Team_Interactive_v${data.version}_${stamp}.html`;
  const blob=new Blob([buildExportHtml()],{type:'text/html'});
  if(window.showSaveFilePicker){
    window.showSaveFilePicker({
      suggestedName:filename,
      types:[{description:'HTML File',accept:{'text/html':['.html']}}]
    }).then(h=>h.createWritable()).then(w=>w.write(blob).then(()=>w.close()))
      .catch(err=>{if(err.name!=='AbortError') downloadBlob(blob,filename);});
  } else {
    downloadBlob(blob,filename);
  }
}

function toBase64Utf8(str){
  const bytes=new TextEncoder().encode(str);
  let bin='';
  for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode(...bytes.subarray(i,i+8192));
  return btoa(bin);
}

async function publishToGitHub(){
  const btn=document.getElementById('publishBtn');
  const REPO='LucaLinkAI/newgen-taskboard';

  let token=localStorage.getItem('ng-gh-token');
  if(!token){
    token=prompt('GitHub Personal Access Token\n(needs Contents: Read & Write on '+REPO+')\n\nShift+click ☁ 发布 to reset the token.');
    if(!token)return;
    localStorage.setItem('ng-gh-token',token.trim());
    token=token.trim();
  }

  data.version=bumpVersion(data.version);
  save();
  const html=buildExportHtml();

  if(btn){btn.textContent='⏳ 发布中...';btn.style.opacity='.6';}
  try{
    const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
    const getRes=await fetch(`https://api.github.com/repos/${REPO}/contents/index.html`,{headers});
    if(!getRes.ok) throw new Error('GitHub '+getRes.status+': '+getRes.statusText);
    const {sha}=await getRes.json();

    const putRes=await fetch(`https://api.github.com/repos/${REPO}/contents/index.html`,{
      method:'PUT',headers,
      body:JSON.stringify({message:`publish v${data.version}`,content:toBase64Utf8(html),sha})
    });
    if(!putRes.ok){const e=await putRes.json();throw new Error(e.message||putRes.status);}

    if(btn){btn.textContent='✓ 已发布';btn.style.opacity='';setTimeout(()=>{btn.textContent='☁ 发布';},3000);}
    showToast('已推送 GitHub ✓');
  }catch(err){
    console.error(err);
    if(btn){btn.textContent='✗ 失败';btn.style.opacity='';setTimeout(()=>{btn.textContent='☁ 发布';},3000);}
    alert('发布失败: '+err.message);
  }
}

rPage();
